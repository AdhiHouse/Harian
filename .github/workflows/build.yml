name: Build Prodmast 32-bit Exe

on:
  push:
    branches: [ main, master ]

jobs:
  build-win32:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.8 (32-bit)
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        architecture: 'x86'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter pandas==2.0.3 openpyxl pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --icon=app_icon.ico --name="AppModern" app_modern.py

    - name: Upload Artifact (Exe Output)
      uses: actions/upload-artifact@v4
      with:
        name: AppModern-32bit
        path: dist/AppModern.exe
